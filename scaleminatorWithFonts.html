	<style>
		:root {
			color-scheme: light;
			--ink: #202721;
			--muted: #68736b;
			--paper: #d7d7d7;
			--surface: #fffdf5;
			--surface-soft: rgba(255,255,255,.5);
			--border: rgba(32,39,33,.22);
			--wood: #a96b42;
			--wood-light: #ba8055;
			--wood-dark: #76472f;
			--gold: #f0cb70;
			--line: rgba(51, 31, 22, .78);
			--pink: #d65c91;
			--neck-min-width: 1306px;
			--neck-row-template: 30px calc(258px * var(--string-scale, 1)) 30px;
			--note-size: 39px;
			--note-font-size: 13px;
			--note-small-size: 9px;
			--label-font-size: 17px;
		}

		body[data-theme="night"] {
			color-scheme: dark;
			--ink: #f0eadf;
			--muted: #b4b8ae;
			--paper: #202725;
			--surface: #303936;
			--surface-soft: rgba(48,57,54,.85);
			--border: rgba(232,235,220,.2);
			--wood: #68452f;
			--wood-light: #7d583f;
			--wood-dark: #3f3028;
		}

		body[data-theme="night"] {
			background:
				radial-gradient(ellipse at 8% 4%, rgba(104,116,105,.16), transparent 40%),
				repeating-linear-gradient(0deg, transparent 0 39px, rgba(220,230,215,.025) 40px),
				var(--paper);
		}

		* { box-sizing: border-box; }

		/* No pull-to-refresh / scroll chaining into the browser chrome on touch devices. */
		html,
		body { overscroll-behavior-y: none; }

		body {
			display: flex;
			min-height: 100vh;
			min-height: 100svh;
			flex-direction: column;
			margin: 0;
			min-width: 320px;
			background:
				radial-gradient(ellipse at 8% 4%, rgba(255,255,255,.8), transparent 40%),
				repeating-linear-gradient(0deg, transparent 0 39px, rgba(58,67,53,.035) 40px),
				var(--paper);
			color: var(--ink);
			font-family: "Nunito Sans", "Segoe UI", sans-serif;
			transition: background-color .2s ease, color .2s ease;
		}

		main {
			flex: 1;
			width: min(100%, 2000px);
			margin: 0 auto;
			padding: 48px clamp(18px, 4vw, 58px) 40px;
		}
		
		@media screen and (min-width: 1800px) and (min-height: 721px) {
			:root:not([data-view="compact"]) {
				--neck-min-width: 100%;
				--neck-row-template: 40px calc(380px * var(--string-scale, 1)) 40px;
				--note-size: 54px;
				--note-font-size: 18px;
				--note-small-size: 11px;
				--label-font-size: 24px;
				--fret-number-size: 20px;
				--inlay-size: 20px;
			}
		}

		body[data-view="compact"] {
			--neck-min-width: 100%;
			--neck-row-template: 24px calc(180px * var(--string-scale, 1)) 24px;
			--note-size: 26px;
			--note-font-size: 10px;
			--note-small-size: 0px;
			--label-font-size: 13px;
		}
		body[data-view="compact"] .note small { display: none; }

		.mobile-controls-drawer,
		.mobile-topbar { display: none; }

		.eyebrow {
			margin: 0 0 12px;
			color: #a45e37;
			font-size: 12px;
			font-weight: 800;
			letter-spacing: .12em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-family: "Ribeye Marrow", Georgia, serif;
			font-size: 56px;
			font-weight: 400;
			line-height: 1.05;
		}

		.page-heading { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 18px; }

		.scale-note-button {

		.neck-scroll {

			.mobile-controls-panel {

				left: 0;
				--drawer-w: min(340px, 88vw);

				-webkit-overflow-scrolling: touch;
			}
			/* While the drawer is open the page behind it must not scroll (that is what pulls the browser bar back in). */
			html:has(.mobile-controls-drawer[open]),
			body:has(.mobile-controls-drawer[open]) { overflow: hidden; }

			}
			.mobile-controls-panel .scale-family-list,

				grid-template-rows: 20px calc(170px * var(--string-scale, 1)) 20px !important;

			.note {

<body>
	<main>

	<script>
		// Strings are built for the current instrument (see setStringCount). Index 0 is the top row (highest string).
		let strings = [];
		const keys = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
		const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
		// Instruments and their tunings. Notes go from the top row (highest string) to the bottom row (lowest string).
		// "prefix" is added before the tuning name in the title; guitar (6 strings) has none.
		const instruments = {
			"guitar-6": {

			dadgad: { label: "DADGAD", group: "other", notes: ["D", "A", "G", "D", "A", "D"] },
			"double-drop-d": { label: "Double drop D", group: "other", notes: ["D", "B", "G", "D", "A", "D"] },
			"all-fourths": { label: "All fourths", group: "other", notes: ["F", "C", "G", "D", "A", "E"] },
			"new-standard": { label: "New standard (CGDAEG)", group: "other", notes: ["G", "E", "A", "D", "G", "C"] }
				}
			},

				tunings: {

			cavaquinho: {

					"cbg-open-g": { label: "Open G (GDG)", notes: ["G", "D", "G"] },

		// Flat lookup: tuning id -> { label, notes, group?, instrument }.
		const tunings = {};
		Object.entries(instruments).forEach(([instrumentId, instrument]) => {
			Object.entries(instrument.tunings).forEach(([id, tuning]) => { tunings[id] = { ...tuning, instrument: instrumentId }; });
		});
		// Tuning loaded when the number of strings is picked in the "Strings" dropdown.
		const defaultTuningByStringCount = { 3: "cbg-open-g", 4: "b4-e-standard", 5: "b5-standard", 6: "e-standard", 7: "g7-standard", 8: "g8-standard" };
		// The open-string notes from low to high, e.g. "D A D G B E".
		function tuningNotesLowToHigh() {
			return strings.map(string => string.note).reverse().join(" ");
		}
		function tuningDisplayName() {
			if (selectedTuning === "custom") return `Custom: ${tuningNotesLowToHigh()}`;
			const tuning = tunings[selectedTuning];
			const prefix = instruments[tuning.instrument].prefix;
			return prefix ? `${prefix} ${tuning.label}` : tuning.label;
		}
		const scaleFamilies = {
			pentatonic: {
				label: "Pentatonic",
				scales: {

					major: { name: "Major", group: "common", intervals: [0, 2, 4, 7, 9], degrees: ["1", "2", "3", "5", "6"] },
					suspended: { name: "Suspended (Egyptian)", group: "common", intervals: [0, 2, 5, 7, 10], degrees: ["1", "2", "4", "5", "♭7"] },

		const neckLayout = document.querySelector(".neck-layout");
		const openStrings = document.querySelector("#open-strings");
		const neckScroll = document.querySelector(".neck-scroll");
		const stringLabels = document.querySelector("#string-labels");
		const stringCountSelect = document.querySelector("#string-count");
		const markers = document.querySelector("#position-markers");
		const keySelect = document.querySelector("#key-select");
		const tuningMenu = document.querySelector("#tuning-menu");
		const tuningFamilyList = document.querySelector("#tuning-family-list");
		const tuningSubmenu = document.querySelector("#tuning-submenu");
		const selectedTuningLabel = document.querySelector("#selected-tuning-label");
		const scaleMenu = document.querySelector("#scale-menu");
		const scaleMenuPanel = document.querySelector("#scale-menu-panel");
		const scaleFamilyList = document.querySelector("#scale-family-list");
		const scaleSubmenu = document.querySelector("#scale-submenu");
		const themeToggle = document.querySelector("#theme-toggle");
		const pageTools = document.querySelector("#page-tools");
		const pageToolsSlot = document.querySelector("#page-tools-slot");
		const keyControl = document.querySelector("#key-control");
		const keyControlSlot = document.querySelector("#key-control-slot");
		const mobileControlsDrawer = document.querySelector("#mobile-controls-drawer");
		const mobileControlsContent = document.querySelector("#mobile-controls-content");
		const mobileScaleTitle = document.querySelector("#mobile-scale-title");
		const responsiveViewport = typeof window !== "undefined" && window.matchMedia ? window.matchMedia("(max-width: 900px), (max-height: 720px), (pointer: coarse)") : null;
		const scaleTitleMain = document.querySelector("#scale-title-main");
		const scaleTitleTuning = document.querySelector("#scale-title-tuning");
		const fretRangeStart = document.querySelector("#fret-range-start");
		const fretRangeEnd = document.querySelector("#fret-range-end");
		const fretRangeFill = document.querySelector("#fret-range-fill");
		const fretRangeValue = document.querySelector("#fret-range-value");
		let fretCount = 24;
		// totalFrets: frets on the current instrument (from its maxFrets). maxFret: biggest interval that fits on screen (24 or 12).
		// fretRange: what the user chose to show.
		let totalFrets = 24;
		let maxFret = 24;
		let fretRange = { start: 0, end: 24 };
		let compactMode = null;
		let responsiveControlsReady = false;
		let selectedFamily = "pentatonic";
		let selectedScale = "minor";
		let openMenuFamily = "pentatonic";
		let openPentatonicGroup = "common";
		// "notes" = scale notes (original mode); "chords" = chords of a chord scale, one shown at a time.
		let mode = "notes";
		let chordFamily = "diatonic";
		let chordScale = "ionian";
		let chordType = "triads";
		let selectedChord = 0;
		const modeSelect = document.querySelector("#mode-select");
		const scaleLabel = document.querySelector("#scale-label");
		let selectedTuning = "e-standard";
		let openTuningInstrument = "guitar-6";
		let openTuningGroup = "standard";
		let noteStates = new Map();
		// Red is reserved for the root. Stack for the other notes: yellow, green, pink, orange, purple, grey, brown.
		const rootFocusColor = "#e93333";
		const focusColors = ["#f7d417", "#57c96a", "#e94fae", "#ff861f", "#b57be8", "#a1a1a1", "#c8925d"];
		// pitch -> colour taken from the stack when that note was focused.
		let focusColorByPitch = new Map();
		// Take the first free colour in stack order; a released colour goes back in its original place.
		function takeFocusColor(pitch) {
			const used = new Set(focusColorByPitch.values());
			focusColorByPitch.set(pitch, focusColors.find(color => !used.has(color)) || focusColors[focusColors.length - 1]);
		}
		function releaseFocusColor(pitch) {
			focusColorByPitch.delete(pitch);
		}
		const focusedNoteText = "#111111";
		function getToneFocusColor(tone) {
			if (tone.blue) return "#54b9e8";
			if (tone.root) return rootFocusColor;
			return focusColorByPitch.get(tone.pitch) || focusColors[0];
		}
		const scaleTitle = document.querySelector("#scale-title");
		const scaleNotes = document.querySelector("#scale-notes");
		const notePositions = [];
		function syncResponsiveControls() {
			const useCompactMode = Boolean(responsiveViewport?.matches);
			const availableWidth = neckScroll.clientWidth || window.innerWidth || 0;
			const nextMaxFret = useCompactMode || availableWidth < 1306 ? 12 : 24;
			if (compactMode !== useCompactMode || maxFret !== nextMaxFret) {
				const firstSync = compactMode === null;
				const previousMaxFret = maxFret;
				compactMode = useCompactMode;
				maxFret = nextMaxFret;
				if (firstSync) {
					// Default: the whole neck if it fits, otherwise 0-12.
					fretRange = defaultFretRange();
				} else if (maxFret < previousMaxFret) {
					// Getting smaller: keep the interval if it fits, otherwise back to 0-12.
					if (fretRange.end - fretRange.start > maxFret) fretRange = defaultFretRange();
				} else if (maxFret > previousMaxFret && fretRange.start === 0 && fretRange.end === Math.min(previousMaxFret, totalFrets)) {
					// Getting bigger: 0-12 grows to the whole neck, any other interval is kept.
					fretRange = defaultFretRange();
				}
				buildFretboard();
				renderFretRange();
				if (responsiveControlsReady) updateTuning(false);
			}
			if (useCompactMode) {
				mobileControlsContent.append(pageTools, keyControl);
			} else {
				pageToolsSlot.append(pageTools);
				keyControlSlot.append(keyControl);
				mobileControlsDrawer.open = false;
			}
		}

		if (responsiveViewport) {
			if (responsiveViewport.addEventListener) responsiveViewport.addEventListener("change", syncResponsiveControls);
			else responsiveViewport.addListener(syncResponsiveControls);
			window.addEventListener("resize", syncResponsiveControls);
		}

		// Whole neck if it fits on screen, otherwise 0-12 (never past the instrument's last fret).
		function defaultFretRange() {
			return { start: 0, end: Math.min(maxFret, totalFrets) };
		}

		// Switch to an instrument with a different number of frets.
		function setTotalFrets(count) {
			if (count === totalFrets) return;
			const wasDefault = fretRange.start === 0 && fretRange.end === Math.min(maxFret, totalFrets);
			totalFrets = count;
			if (wasDefault) {
				fretRange = defaultFretRange();
			} else if (fretRange.end > totalFrets) {
				// Cut the range at the new last fret.
				fretRange = { start: Math.min(fretRange.start, totalFrets - 1), end: totalFrets };
			}
			buildFretboard();
			renderFretRange();
		}

		function renderFretRange() {
			[fretRangeStart, fretRangeEnd].forEach(input => { input.max = totalFrets; });
			fretRangeStart.value = fretRange.start;
			fretRangeEnd.value = fretRange.end;
			fretRangeFill.style.left = `${(fretRange.start / totalFrets) * 100}%`;
			fretRangeFill.style.width = `${((fretRange.end - fretRange.start) / totalFrets) * 100}%`;
			fretRangeValue.textContent = `${fretRange.start}–${fretRange.end}`;
			// Keep the start thumb grabbable when both thumbs sit at the far right.
			fretRangeStart.style.zIndex = fretRange.start >= totalFrets - 1 ? 2 : 1;
		}

		// movedThumb: "start" or "end". When the interval is too big for the screen,
		// the thumb being dragged is blocked so the span never exceeds maxFret.
		function setFretRange(start, end, movedThumb) {
			end = Math.min(Math.max(end, 1), totalFrets);
			start = Math.min(Math.max(start, 0), end - 1);
			if (end - start > maxFret) {
				if (movedThumb === "start") start = end - maxFret;
				else end = start + maxFret;
			}
			if (start !== fretRange.start || end !== fretRange.end) {
				fretRange = { start, end };
				buildFretboard();
				updateTuning(false);
			}
			renderFretRange();
		}

		function buildFretboard() {
			const showOpen = fretRange.start === 0;
			const firstFret = Math.max(fretRange.start, 1);
			const lastFret = fretRange.end;
			fretCount = lastFret - firstFret + 1;
			const fretColumns = `repeat(${fretCount}, minmax(0, 1fr))`;
			fretNumbers.style.gridTemplateColumns = fretColumns;
			fretboard.style.gridTemplateColumns = fretColumns;
			markers.style.gridTemplateColumns = fretColumns;
			// Fluid width whenever 24 frets don't fit (compact) or few frets are shown.
			const fluid = maxFret < 24 || fretCount <= 12;
			neckLayout.style.width = fluid ? "100%" : "";
			neckLayout.style.minWidth = fluid ? "0" : "1306px";
			fretboard.classList.toggle("no-nut", !showOpen);
			neckLayout.classList.toggle("no-open", !showOpen);
			openStrings.style.visibility = showOpen ? "" : "hidden";
			document.querySelector("#open-fret-number").style.visibility = showOpen ? "" : "hidden";
			fretNumbers.replaceChildren();
			markers.replaceChildren();
			fretboard.replaceChildren();
			openStrings.replaceChildren();
			notePositions.length = 0;
			neckScroll.setAttribute("aria-label", `Guitar fretboard, frets ${firstFret} through ${lastFret}${showOpen ? ", with open strings at the left" : ""}`);

			for (let fret = firstFret; fret <= lastFret; fret += 1) {
				const column = fret - firstFret + 1;
				const number = document.createElement("span");
				number.textContent = fret;
				fretNumbers.append(number);

				if ([3, 5, 7, 9, 12, 15, 17, 19, 21, 24].includes(fret)) {
					const marker = document.createElement("span");
					marker.style.gridColumn = column;
					if (fret === 12 || fret === 24) marker.classList.add("double");
					markers.append(marker);

					// Inlay dots on the wood, between strings, under the strings and notes.
					// Single dots sit in the middle gap; double dots in two symmetric gaps
					// (on 6 strings: between G/D, and between B/G and D/A).
					const count = strings.length;
					const sideGap = Math.max(1, Math.floor(count / 2) - 1);
					const inlayRows = fret === 12 || fret === 24
						? [sideGap / count, (count - sideGap) / count]
						: [Math.floor(count / 2) / count];
					inlayRows.forEach(row => {
						const inlay = document.createElement("span");
						inlay.className = "inlay";
						inlay.style.left = `${((column - 0.5) / fretCount) * 100}%`;
						inlay.style.top = `calc(4px + (100% - 8px) * ${row})`;
						fretboard.append(inlay);
					});
				}
			}

			strings.forEach((string, stringIndex) => {
				const openCell = document.createElement("div");
				openCell.className = "open-cell";
				openCell.dataset.stringIndex = stringIndex;
				openCell.style.gridRow = stringIndex + 1;
				openCell.setAttribute("aria-label", `String ${stringIndex + 1} open`);
				openStrings.append(openCell);
				if (showOpen) notePositions.push(openCell);

				for (let fret = firstFret; fret <= lastFret; fret += 1) {
					const cell = document.createElement("div");
					cell.className = "fret-cell";
					cell.dataset.stringIndex = stringIndex;
					cell.dataset.fret = fret;
					cell.style.gridColumn = fret - firstFret + 1;
					cell.style.gridRow = stringIndex + 1;
					fretboard.append(cell);
					notePositions.push(cell);
				}

				const line = document.createElement("span");
				line.className = "string-line";
				line.style.setProperty("--thickness", string.thickness);
				// Centre each string on its grid row (rows start after the 4px vertical padding).
				line.style.top = `calc(4px + (100% - 8px) * ${(stringIndex + 0.5) / strings.length})`;
				fretboard.append(line);
			});

			for (let fret = firstFret; fret < lastFret; fret += 1) {
				const wire = document.createElement("span");
				wire.className = `fret-wire${fret === 12 ? " double" : ""}`;
				wire.style.setProperty("--left", `${((fret - firstFret + 1) / fretCount) * 100}%`);
				fretboard.append(wire);
			}
		}

		fretRangeStart.addEventListener("input", () => {
			setFretRange(Number(fretRangeStart.value), fretRange.end, "start");
		});
		fretRangeEnd.addEventListener("input", () => {
			setFretRange(fretRange.start, Number(fretRangeEnd.value), "end");
		});

		// Rebuild the neck for a new number of strings. Returns false if nothing changed.
		function setStringCount(count) {
			if (strings.length === count) return false;
			strings = Array.from({ length: count }, (_, index) => ({
				note: "E",
				pitch: 4,
				// Thin high strings at the top, thicker low strings at the bottom.
				thickness: `${(1.6 + (3.2 * index) / Math.max(count - 1, 1)).toFixed(2)}px`
			}));
			// Rows follow the string count; more strings make the neck a bit taller.
			document.documentElement.style.setProperty("--string-count", count);
			document.documentElement.style.setProperty("--string-scale", Math.max(count, 4.5) / 6);
			stringCountSelect.value = count;
			buildStringSelects();
			buildFretboard();
			return true;
		}

		stringCountSelect.addEventListener("change", () => {
			selectedTuning = defaultTuningByStringCount[stringCountSelect.value];
			updateTuning();
		});

		// One dropdown per string to pick its open note.
		function buildStringSelects() {
			stringLabels.replaceChildren();
			strings.forEach((string, index) => {
				const select = document.createElement("select");
				select.className = "string-note-select";
				select.dataset.stringIndex = index;
				select.setAttribute("aria-label", `Open note of string ${index + 1}`);
				// Listed from A to G#.
				[...noteNames.slice(9), ...noteNames.slice(0, 9)].forEach(note => select.add(new Option(note, note)));
				stringLabels.append(select);
			});
		}

		stringLabels.addEventListener("change", event => {
			const select = event.target.closest(".string-note-select");
			if (!select) return;
			strings[Number(select.dataset.stringIndex)].note = select.value;
			// A known tuning if the notes match one (current instrument first), otherwise custom.
			const notes = strings.map(string => string.note).join();
			const currentInstrument = openTuningInstrument;
			const ids = Object.keys(tunings).sort((a, b) =>
				(tunings[b].instrument === currentInstrument) - (tunings[a].instrument === currentInstrument));
			selectedTuning = ids.find(id => tunings[id].notes.join() === notes) || "custom";
			applyTuning(false);
		});

		// Load the notes of the selected tuning into the strings, then redraw.
		function updateTuning(resetNoteStates = true) {
			const tuning = tunings[selectedTuning];
			if (tuning) {
				// A tuning with a different number of strings resets the neck to that number.
				setStringCount(tuning.notes.length);
				setTotalFrets(instruments[tuning.instrument].maxFrets);
				strings.forEach((string, index) => { string.note = tuning.notes[index]; });
			}
			applyTuning(resetNoteStates);
		}

		function applyTuning(resetNoteStates) {
			strings.forEach((string, index) => {
				string.pitch = noteNames.indexOf(string.note);
				stringLabels.children[index].value = string.note;
			});
			selectedTuningLabel.textContent = tuningDisplayName();
			if (tunings[selectedTuning]) {
				openTuningInstrument = tunings[selectedTuning].instrument;
				if (tunings[selectedTuning].group) openTuningGroup = tunings[selectedTuning].group;
			}
			populateTunings();
			notePositions.forEach(cell => {
				const string = strings[Number(cell.dataset.stringIndex)];
				const fret = Number(cell.dataset.fret || 0);
				cell.dataset.pitch = (string.pitch + fret) % 12;
				if (cell.classList) cell.classList.toggle("open-cell", !cell.dataset.fret);
			});
			updateScale(resetNoteStates);
		}

		function populateTunings() {
			// Left column: instruments.
			tuningFamilyList.replaceChildren();
			Object.entries(instruments).forEach(([instrumentId, instrument]) => {
				const button = document.createElement("button");
				button.type = "button";
				button.className = "scale-family-button";
				button.dataset.tuningInstrument = instrumentId;
				button.setAttribute("aria-expanded", String(instrumentId === openTuningInstrument));
				button.textContent = instrument.label;
				tuningFamilyList.append(button);
			});

			// Right column: subgroup buttons (if the instrument has them), then its tunings.
			tuningSubmenu.replaceChildren();
			const instrument = instruments[openTuningInstrument];
			if (instrument.groups) {
				const groupNav = document.createElement("div");
				groupNav.className = "pentatonic-groups";
				Object.entries(instrument.groups).forEach(([groupKey, label]) => {
					const button = document.createElement("button");
					button.type = "button";
					button.className = "pentatonic-group-button";
					button.dataset.tuningSubgroup = groupKey;
					button.setAttribute("aria-pressed", String(groupKey === openTuningGroup));
					button.textContent = label;
					groupNav.append(button);
				});
				tuningSubmenu.append(groupNav);
			}
			Object.entries(tunings).filter(([, tuning]) =>
				tuning.instrument === openTuningInstrument && (!instrument.groups || tuning.group === openTuningGroup)
			).forEach(([id, tuning]) => {
				const button = document.createElement("button");
				button.type = "button";
				button.className = "scale-option has-description";
				button.dataset.tuning = id;
				button.setAttribute("aria-pressed", String(id === selectedTuning));
				const name = document.createElement("span");
				name.textContent = tuning.label;
				const notes = document.createElement("span");
				notes.className = "scale-option-description";
				notes.textContent = [...tuning.notes].reverse().join(" ");
				button.append(name, notes);
				tuningSubmenu.append(button);
			});
		}

		function populateChordScales() {
			scaleFamilyList.replaceChildren();
			chordFamilyKeys.forEach(familyKey => {
				const button = document.createElement("button");
				button.type = "button";
				button.className = "scale-family-button";
				button.dataset.family = familyKey;
				button.setAttribute("aria-expanded", String(familyKey === openMenuFamily));
				button.textContent = scaleFamilies[familyKey].label;
				scaleFamilyList.append(button);
			});
			scaleSubmenu.replaceChildren();
			const typeNav = document.createElement("div");
			typeNav.className = "pentatonic-groups";
			Object.entries(chordTypes).forEach(([type, label]) => {
				const button = document.createElement("button");
				button.type = "button";
				button.className = "pentatonic-group-button";
				button.dataset.chordType = type;
				button.setAttribute("aria-pressed", String(type === chordType));
				button.textContent = label;
				typeNav.append(button);
			});
			scaleSubmenu.append(typeNav);
			const rootPitch = keys.indexOf(keySelect.value);
			Object.entries(scaleFamilies[openMenuFamily].scales).forEach(([value, definition]) => {
				const button = document.createElement("button");
				button.type = "button";
				button.className = "scale-option has-description";
				button.dataset.scale = value;
				button.setAttribute("aria-pressed", String(chordFamily === openMenuFamily && chordScale === value));
				const name = document.createElement("span");
				name.textContent = definition.name;
				const chords = document.createElement("span");
				chords.className = "scale-option-description";
				chords.textContent = buildScaleChords(definition, rootPitch, chordType).map(chord => chord.name).join("  ");
				button.append(name, chords);
				scaleSubmenu.append(button);
			});
		}

		function populateScales() {
			if (mode === "chords") return populateChordScales();
			scaleFamilyList.replaceChildren();
			const family = scaleFamilies[openMenuFamily];
			Object.entries(scaleFamilies).forEach(([familyKey, familyDefinition]) => {
				const button = document.createElement("button");
				button.type = "button";
				button.className = "scale-family-button";
				button.dataset.family = familyKey;
				button.setAttribute("aria-expanded", String(familyKey === openMenuFamily));
				button.textContent = familyDefinition.label;
				scaleFamilyList.append(button);
			});
			scaleSubmenu.replaceChildren();
			let visibleScales = Object.entries(family.scales);
			if (openMenuFamily === "pentatonic") {
				const groupNav = document.createElement("div");
				groupNav.className = "pentatonic-groups";
				const groupLabels = { common: "Common", japanese: "Japanese", indian: "Indian", other: "Other" };
				Object.entries(groupLabels).forEach(([group, label]) => {
					const button = document.createElement("button");
					button.type = "button";
					button.className = "pentatonic-group-button";
					button.dataset.pentatonicGroup = group;
					button.setAttribute("aria-pressed", String(group === openPentatonicGroup));
					button.textContent = label;
					groupNav.append(button);
				});
				scaleSubmenu.append(groupNav);
				visibleScales = visibleScales.filter(([, definition]) => definition.group === openPentatonicGroup);
			}
			visibleScales.forEach(([value, definition]) => {
				const button = document.createElement("button");
				button.type = "button";
				button.className = `scale-option${definition.description ? " has-description" : ""}`;
				button.dataset.scale = value;
				button.setAttribute("aria-pressed", String(selectedFamily === openMenuFamily && selectedScale === value));
				const name = document.createElement("span");
				name.textContent = definition.name;
				button.append(name);
				if (definition.description) {
					const description = document.createElement("span");
					description.className = "scale-option-description";
					description.textContent = definition.description;
					button.append(description);
					button.setAttribute("aria-label", `${definition.name}. ${definition.description}`);
				}
				scaleSubmenu.append(button);
			});
		}

		function updateChords() {
			const key = keySelect.value;
			const definition = scaleFamilies[chordFamily].scales[chordScale];
			const chords = buildScaleChords(definition, keys.indexOf(key), chordType);
			selectedChord = Math.min(selectedChord, chords.length - 1);
			const activeChord = chords[selectedChord];

			const titleWithoutTuning = `${key} ${definition.name} ${chordTypes[chordType].toLowerCase()}`;
			const tuningTitle = tuningDisplayName();
			scaleTitleMain.textContent = titleWithoutTuning;
			scaleTitleTuning.textContent = `(${tuningTitle})`;
			mobileScaleTitle.textContent = titleWithoutTuning;
			document.querySelector("#scale-menu-summary").textContent = definition.name;
			document.title = `${titleWithoutTuning} (${tuningTitle}) | Guitar fretboard`;
			fretboard.setAttribute("aria-label", `${activeChord.name} chord notes on a ${fretCount}-fret guitar neck`);
			scaleNotes.setAttribute("aria-label", `Chords in ${key} ${definition.name}`);
			// Keep the chord names in the open menu in sync with the key.
			populateScales();

			scaleNotes.replaceChildren();
			chords.forEach((chord, index) => {
				const active = index === selectedChord;
				const entry = document.createElement("li");
				entry.className = "scale-note-entry";
				const button = document.createElement("button");
				button.type = "button";
				button.className = "scale-note-button";
				button.dataset.chordIndex = index;
				button.dataset.state = active ? "focused" : "showing";
				button.style.setProperty("--focus-color", rootFocusColor);
				button.style.setProperty("--focus-ink", focusedNoteText);
				button.setAttribute("aria-pressed", String(active));
				button.setAttribute("aria-label", `${chord.roman} ${chord.name}: ${chord.tones.map(tone => tone.note).join(" ")}`);
				button.title = `${chord.name}: ${chord.tones.map(tone => tone.note).join(" ")}`;
				button.innerHTML = `<strong>${chord.roman}</strong> ${chord.name}`;
				entry.append(button);
				scaleNotes.append(entry);
			});

			// Root of the chord in red, the other chord tones in the colour stack order.
			const toneColors = new Map(activeChord.tones.map((tone, index) => [tone.pitch, tone.root ? rootFocusColor : focusColors[index - 1]]));
			const chordTones = new Map(activeChord.tones.map(tone => [tone.pitch, tone]));
			notePositions.forEach(cell => {
				cell.querySelector(".note")?.remove();
				const tone = chordTones.get(Number(cell.dataset.pitch));
				if (!tone) return;
				const note = document.createElement("span");
				note.className = `note focused${tone.root ? " root" : ""}`;
				note.style.setProperty("--focus-color", toneColors.get(tone.pitch));
				note.style.setProperty("--focus-ink", focusedNoteText);
				note.setAttribute("aria-label", `${tone.note}, chord tone ${tone.degree}`);
				note.innerHTML = `<strong>${tone.note}</strong><small>${tone.degree}</small>`;
				cell.append(note);
			});
		}

		function updateScale(resetNoteStates = true) {
					if (mode === "chords") return updateChords();
					const key = keySelect.value;
					const family = scaleFamilies[selectedFamily];
					const definition = family.scales[selectedScale];
					const rootPitch = keys.indexOf(key);
					const tones = definition.intervals.map((interval, index) => ({
						pitch: (rootPitch + interval) % 12,
						interval,
						note: noteNames[(rootPitch + interval) % 12],
						degree: definition.degrees[index],
						root: index === 0,
						blue: definition.blueInterval === interval
					}));
					const blueNoteAvailable = selectedFamily === "pentatonic" && ["minor", "major"].includes(selectedScale);
					const blueInterval = selectedScale === "major" ? 3 : 6;
					if (blueNoteAvailable) {
						tones.push({
							pitch: (rootPitch + blueInterval) % 12,
							interval: blueInterval,
							note: noteNames[(rootPitch + blueInterval) % 12],
							degree: selectedScale === "major" ? "♭3" : "♭5",
							root: false,
							blue: true,
							optional: true
						});
					}
					tones.sort((first, second) => first.interval - second.interval);
					const scale = new Map(tones.map(tone => [tone.pitch, tone]));

					const titleWithoutTuning = `${key} ${family.label} ${definition.name}`;
					const tuningTitle = tuningDisplayName();
					scaleTitleMain.textContent = titleWithoutTuning;
					scaleTitleTuning.textContent = `(${tuningTitle})`;
					mobileScaleTitle.textContent = titleWithoutTuning;
					// Scale dropdown shows the selected scale's name (no family or subgroup).
					document.querySelector("#scale-menu-summary").textContent = definition.name;
					document.title = `${titleWithoutTuning} (${tuningTitle}) | Guitar fretboard`;
					fretboard.setAttribute("aria-label", `${key} ${definition.name} notes on a ${fretCount}-fret guitar neck`);
					scaleNotes.setAttribute("aria-label", `Notes in ${key} ${definition.name}`);

					if (resetNoteStates) {
						noteStates = new Map(tones.map(tone => [
							tone.pitch,
							tone.optional ? "invisible" : tone.root ? "focused" : "showing"
						]));
						focusColorByPitch = new Map();
						tones.forEach(tone => {
							if (noteStates.get(tone.pitch) === "focused" && !tone.blue && !tone.root) takeFocusColor(tone.pitch);
						});
					}

					scaleNotes.replaceChildren();
					tones.forEach(tone => {
						const state = noteStates.get(tone.pitch) || "showing";
						const entry = document.createElement("li");
						entry.className = "scale-note-entry";
						const button = document.createElement("button");
						button.type = "button";
						button.className = "scale-note-button";
						button.dataset.pitch = tone.pitch;
						button.dataset.state = state;
						button.dataset.blue = String(tone.blue);
						button.dataset.root = String(tone.root);
						button.dataset.degree = tone.degree;
						const focusColor = getToneFocusColor(tone);
						button.style.setProperty("--focus-color", focusColor);
						button.style.setProperty("--focus-ink", focusedNoteText);
						button.setAttribute("aria-pressed", String(state === "focused"));
						button.setAttribute("aria-label", `${tone.degree} ${tone.note}, ${state}. Activate to change state.`);
						button.title = `${tone.degree} ${tone.note}: ${state}`;
						button.innerHTML = `<strong>${tone.degree}</strong> ${tone.note}`;
						if (tone.blue) {
							const tag = document.createElement("span");
							tag.className = "blue-note-tag";
							tag.textContent = "BLUE NOTE";
							entry.append(button, tag);
						} else {
							entry.append(button);
						}
						scaleNotes.append(entry);
					});

					notePositions.forEach(cell => {
						cell.querySelector(".note")?.remove();
						const tone = scale.get(Number(cell.dataset.pitch));
						if (!tone) return;
						const state = noteStates.get(tone.pitch) || "showing";
						if (state === "invisible") return;

						const note = document.createElement("span");
						note.className = `note ${state}${tone.root ? " root" : ""}${tone.blue ? " blue" : ""}`;
						const focusColor = getToneFocusColor(tone);
						note.style.setProperty("--focus-color", focusColor);
						note.style.setProperty("--focus-ink", focusedNoteText);
						note.setAttribute("aria-label", `${tone.note}, scale degree ${tone.degree}`);
						note.innerHTML = `<strong>${tone.note}</strong><small>${tone.degree}</small>`;
						cell.append(note);
					});
				}
		scaleFamilyList.addEventListener("click", event => {
			const button = event.target.closest("[data-family]");
			if (!button) return;
			openMenuFamily = button.dataset.family;
			if (mode === "notes" && openMenuFamily === "pentatonic") {
				openPentatonicGroup = selectedFamily === "pentatonic" ?
					scaleFamilies.pentatonic.scales[selectedScale].group : "common";
			}
			populateScales();
		});
		scaleSubmenu.addEventListener("click", event => {
			const typeButton = event.target.closest("[data-chord-type]");
			if (!typeButton) return;
			chordType = typeButton.dataset.chordType;
			updateScale();
		});
		scaleSubmenu.addEventListener("click", event => {
			const groupButton = event.target.closest("[data-pentatonic-group]");
			if (!groupButton) return;
			openPentatonicGroup = groupButton.dataset.pentatonicGroup;
			populateScales();
		});
		tuningFamilyList.addEventListener("click", event => {
			const button = event.target.closest("[data-tuning-instrument]");
			if (!button) return;
			openTuningInstrument = button.dataset.tuningInstrument;
			const groups = instruments[openTuningInstrument].groups;
			if (groups) {
				const current = tunings[selectedTuning];
				openTuningGroup = current && current.instrument === openTuningInstrument ? current.group : Object.keys(groups)[0];
			}
			populateTunings();
		});
		tuningSubmenu.addEventListener("click", event => {
			const groupButton = event.target.closest("[data-tuning-subgroup]");
			if (!groupButton) return;
			openTuningGroup = groupButton.dataset.tuningSubgroup;
			populateTunings();
		});
		tuningSubmenu.addEventListener("click", event => {
			const button = event.target.closest("[data-tuning]");
			if (!button) return;
			selectedTuning = button.dataset.tuning;
			updateTuning();
			tuningMenu.open = false;
		});
		scaleSubmenu.addEventListener("click", event => {
			const button = event.target.closest("[data-scale]");
			if (!button) return;
			if (mode === "chords") {
				chordFamily = openMenuFamily;
				chordScale = button.dataset.scale;
				selectedChord = 0;
			} else {
				selectedFamily = openMenuFamily;
				selectedScale = button.dataset.scale;
			}
			updateScale();
			scaleMenu.open = false;
		});
		// Close either dropdown when tapping anywhere outside its details element.
		document.addEventListener("pointerdown", event => {
			if (!tuningMenu.contains(event.target)) tuningMenu.open = false;
			if (!scaleMenu.contains(event.target)) scaleMenu.open = false;
		});
		document.querySelector("#mobile-controls-backdrop").addEventListener("click", () => {
			tuningMenu.open = false;
			scaleMenu.open = false;
			mobileControlsDrawer.open = false;
		});
		// Escape closes open menus and the mobile controls drawer.
		document.addEventListener("keydown", event => {
			if (event.key !== "Escape") return;
			tuningMenu.open = false;
			scaleMenu.open = false;
			mobileControlsDrawer.open = false;
		});

		scaleNotes.addEventListener("click", event => {
			// Chords mode: only one chord active at a time.
			const chordButton = event.target.closest("[data-chord-index]");
			if (chordButton) {
				selectedChord = Number(chordButton.dataset.chordIndex);
				updateChords();
				return;
			}
			const button = event.target.closest("[data-pitch]");
			if (!button) return;
			const pitch = Number(button.dataset.pitch);
			const currentState = noteStates.get(pitch);
			const nextState = { focused: "showing", showing: "invisible", invisible: "focused" }[currentState];
			noteStates.set(pitch, nextState);
			// The root (red) and blue notes keep their own colour and never use the colour stack.
			if (button.dataset.blue !== "true" && button.dataset.root !== "true") {
				if (currentState === "focused") releaseFocusColor(pitch);
				if (nextState === "focused") takeFocusColor(pitch);
			}
			updateScale(false);
		});
		keySelect.addEventListener("change", updateScale);
		modeSelect.addEventListener("change", () => {
			mode = modeSelect.value;
			openMenuFamily = mode === "chords" ? chordFamily : selectedFamily;
			if (mode === "notes" && openMenuFamily === "pentatonic") openPentatonicGroup = scaleFamilies.pentatonic.scales[selectedScale].group;
			scaleLabel.textContent = mode === "chords" ? "Chord scale" : "Scale";
			populateScales();
			updateScale();
		});
		// Full screen hides the browser bars on phones (Android etc.; iPhone Safari has no Fullscreen API, so the button stays hidden there).
		const fullscreenToggle = document.querySelector("#fullscreen-toggle");
		const fullscreenRoot = document.documentElement;
		const requestFullscreen = fullscreenRoot.requestFullscreen || fullscreenRoot.webkitRequestFullscreen;
		const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
		const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
		function renderFullscreenToggle() {
			const isFullscreen = Boolean(fullscreenElement());
			fullscreenToggle.setAttribute("aria-pressed", String(isFullscreen));
			fullscreenToggle.innerHTML = `<span aria-hidden="true">${isFullscreen ? "✕" : "⛶"}</span> ${isFullscreen ? "Exit full screen" : "Full screen"}`;
		}
		if (requestFullscreen && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
			fullscreenToggle.hidden = false;
			fullscreenToggle.addEventListener("click", () => {
				if (fullscreenElement()) exitFullscreen.call(document);
				else Promise.resolve(requestFullscreen.call(fullscreenRoot, { navigationUI: "hide" })).catch(() => {});
			});
			document.addEventListener("fullscreenchange", renderFullscreenToggle);
			document.addEventListener("webkitfullscreenchange", renderFullscreenToggle);
		}

		themeToggle.addEventListener("click", () => {
			const isNight = document.body.dataset.theme !== "night";
			document.body.dataset.theme = isNight ? "night" : "day";
			themeToggle.setAttribute("aria-pressed", String(isNight));
			themeToggle.setAttribute("aria-label", `${isNight ? "Disable" : "Enable"} night mode`);
			themeToggle.innerHTML = `<span aria-hidden="true">${isNight ? "☀" : "☾"}</span> ${isNight ? "Day mode" : "Night mode"}`;
		});
		populateScales();
		setStringCount(6);
		populateTunings();
		buildFretboard();
		renderFretRange();
		syncResponsiveControls();
		updateTuning();
		responsiveControlsReady = true;
	</script>
</body>
</html>
