<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>E minor pentatonic | Guitar fretboard</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=Ribeye+Marrow&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--ink: #202721;
			--muted: #68736b;
			--paper: #d7d7d7;
			--surface: #fffdf5;
			--surface-soft: rgba(255,255,255,.5);
			--border: rgba(32,39,33,.22);
			--wood: #a96b42;
			--wood-light: #ba8055;
			--wood-dark: #76472f;
			--gold: #f0cb70;
			--line: rgba(51, 31, 22, .78);
			--pink: #d65c91;
			--neck-min-width: 1306px;
			--neck-row-template: 30px calc(258px * var(--string-scale, 1)) 30px;
			--note-size: 39px;
			--note-font-size: 13px;
			--note-small-size: 9px;
			--label-font-size: 17px;
		}

		body[data-theme="night"] {
			color-scheme: dark;
			--ink: #f0eadf;
			--muted: #b4b8ae;
			--paper: #202725;
			--surface: #303936;
			--surface-soft: rgba(48,57,54,.85);
			--border: rgba(232,235,220,.2);
			--wood: #68452f;
			--wood-light: #7d583f;
			--wood-dark: #3f3028;
		}

		body[data-theme="night"] {
			background:
				radial-gradient(ellipse at 8% 4%, rgba(104,116,105,.16), transparent 40%),
				repeating-linear-gradient(0deg, transparent 0 39px, rgba(220,230,215,.025) 40px),
				var(--paper);
		}

		* { box-sizing: border-box; }

		body {
			display: flex;
			min-height: 100vh;
			min-height: 100svh;
			flex-direction: column;
			margin: 0;
			min-width: 320px;
			background:
				radial-gradient(ellipse at 8% 4%, rgba(255,255,255,.8), transparent 40%),
				repeating-linear-gradient(0deg, transparent 0 39px, rgba(58,67,53,.035) 40px),
				var(--paper);
			color: var(--ink);
			font-family: "Nunito Sans", "Segoe UI", sans-serif;
			transition: background-color .2s ease, color .2s ease;
		}

		main {
			flex: 1;
			width: min(100%, 2000px);
			margin: 0 auto;
			padding: 48px clamp(18px, 4vw, 58px) 40px;
		}
		
		@media screen and (min-width: 1800px) and (min-height: 721px) {
			:root:not([data-view="compact"]) {
				--neck-min-width: 100%;
				--neck-row-template: 40px calc(380px * var(--string-scale, 1)) 40px;
				--note-size: 54px;
				--note-font-size: 18px;
				--note-small-size: 11px;
				--label-font-size: 24px;
				--fret-number-size: 20px;
				--inlay-size: 20px;
			}
		}

		body[data-view="compact"] {
			--neck-min-width: 100%;
			--neck-row-template: 24px calc(180px * var(--string-scale, 1)) 24px;
			--note-size: 26px;
			--note-font-size: 10px;
			--note-small-size: 0px;
			--label-font-size: 13px;
		}
		body[data-view="compact"] .note small { display: none; }

		.mobile-controls-drawer,
		.mobile-topbar { display: none; }

		.eyebrow {
			margin: 0 0 12px;
			color: #a45e37;
			font-size: 12px;
			font-weight: 800;
			letter-spacing: .12em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-family: "Ribeye Marrow", Georgia, serif;
			font-size: 56px;
			font-weight: 400;
			line-height: 1.05;
		}

		.page-heading { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
		.page-heading h1 { display: flex; min-width: 0; flex-wrap: wrap; align-items: baseline; column-gap: .28em; row-gap: 4px; }
		.title-main { min-width: 0; }
		.title-tuning { flex: 0 0 auto; white-space: nowrap; font-family: inherit; font-size: .5em; font-weight: 400; }
		.page-tools { display: flex; flex: 0 0 auto; justify-content: flex-end; }
		#theme-toggle {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 8px 11px;
			border: 1px solid var(--border);
			border-radius: 3px;
			background: var(--surface);
			color: var(--ink);
			font: inherit;
			font-weight: 800;
			cursor: pointer;
		}
		#theme-toggle:hover { border-color: var(--pink); }

		.key-control {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 12px;
			margin: 0 0 20px;
		}

		.key-control label {
			color: var(--muted);
			font-size: 13px;
			font-weight: 700;
		}

		.key-control select {
			min-width: 92px;
			padding: 8px 30px 8px 11px;
			border: 1px solid rgba(32,39,33,.25);
			border-radius: 3px;
			background: var(--surface);
			color: var(--ink);
			font: inherit;
			font-weight: 700;
		}

		.scale-menu {
			position: relative;
		}

		.scale-menu > summary {
			display: flex;
			min-width: 190px;
			align-items: center;
			justify-content: space-between;
			gap: 18px;
			padding: 8px 11px;
			border: 1px solid var(--border);
			border-left: 4px solid var(--pink);
			border-radius: 3px;
			background: var(--surface);
			color: var(--ink);
			font-size: 14px;
			font-weight: 700;
			list-style: none;
			cursor: pointer;
		}

		.scale-menu > summary::-webkit-details-marker { display: none; }
		.scale-menu > summary::after { content: "▾"; color: var(--muted); font-size: 12px; }

		.scale-menu-panel {
			position: absolute;
			z-index: 10;
			top: calc(100% + 6px);
			left: 0;
			display: grid;
			width: min(430px, calc(100vw - 36px));
			grid-template-columns: minmax(145px, .8fr) minmax(180px, 1.2fr);
			height: min(70vh, 560px);
			min-height: 220px;
			grid-template-rows: minmax(0, 1fr);
			overflow: hidden;
			border: 1px solid rgba(32,39,33,.22);
			border-radius: 3px;
			background: var(--surface);
			box-shadow: 0 12px 28px rgba(44,35,24,.2);
		}

		.scale-family-list,
		.scale-submenu {
			display: grid;
			align-content: start;
			gap: 3px;
			min-width: 0;
			min-height: 0;
			padding: 7px;
			overflow-y: auto;
			overscroll-behavior: contain;
			-webkit-overflow-scrolling: touch;
		}

		.scale-submenu { grid-auto-rows: max-content; }
		.pentatonic-groups { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
		.pentatonic-group-button { min-height: 36px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 3px; background: transparent; color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; }
		.pentatonic-group-button[aria-pressed="true"],
		.pentatonic-group-button:hover { background: #e9e5d9; }
		body[data-theme="night"] .pentatonic-group-button[aria-pressed="true"],
		body[data-theme="night"] .pentatonic-group-button:hover { background: #47514b; }

		.scale-family-list { border-right: 1px solid rgba(32,39,33,.13); }
		body[data-theme="night"] .scale-family-list { border-color: var(--border); }

		.scale-family-button,
		.scale-option {
			width: 100%;
			min-height: 40px;
			padding: 9px 8px;
			border: 0;
			border-radius: 2px;
			background: transparent;
			color: var(--ink);
			font: inherit;
			font-size: 13px;
			text-align: left;
			cursor: pointer;
		}

		.scale-option.has-description {
			display: grid;
			align-content: center;
			gap: 2px;
		}

		.scale-option-description {
			color: var(--muted);
			font-size: 11px;
			font-weight: 400;
			line-height: 1.25;
		}

		.scale-family-button::after { float: right; content: "›"; color: var(--muted); }
		.scale-family-button[aria-expanded="true"],
		.scale-family-button:hover,
		.scale-option:hover,
		.scale-option[aria-pressed="true"] { background: #e9e5d9; }
		body[data-theme="night"] .scale-family-button[aria-expanded="true"],
		body[data-theme="night"] .scale-family-button:hover,
		body[data-theme="night"] .scale-option:hover,
		body[data-theme="night"] .scale-option[aria-pressed="true"] { background: #47514b; }

		.scale-menu button:focus-visible,
		.scale-menu > summary:focus-visible {
			outline: 2px solid #286d7d;
			outline-offset: 1px;
		}

		.control-group {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.intro {
			max-width: 620px;
			margin: 14px 0 30px;
			color: var(--muted);
			font-size: 16px;
			line-height: 1.6;
		}

		.scale-notes {
			display: flex;
			flex-wrap: wrap;
			gap: 9px;
			margin: 0 0 26px;
			padding: 0;
			list-style: none;
		}

		/* Note buttons and the fret range picker share one row. */
		.notes-row {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 12px 24px;
			margin: 0 0 26px;
		}
		.notes-row .scale-notes { margin: 0; }

		.fret-range {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-left: auto;
			color: var(--muted);
			font-size: 13px;
			font-weight: 700;
			white-space: nowrap;
		}
		.fret-range output {
			display: inline-block;
			min-width: 3.6em;
			color: var(--ink);
			font-family: "DynaPuff", sans-serif;
		}
		.fret-range-slider {
			position: relative;
			width: 200px;
			height: 28px;
		}
		.fret-range-track {
			position: absolute;
			top: 50%;
			right: 9px;
			left: 9px;
			height: 4px;
			border-radius: 2px;
			background: var(--border);
			transform: translateY(-50%);
		}
		.fret-range-fill {
			position: absolute;
			top: 0;
			bottom: 0;
			border-radius: 2px;
			background: var(--pink);
		}
		.fret-range-slider input[type="range"] {
			position: absolute;
			z-index: 1;
			inset: 0;
			width: 100%;
			height: 100%;
			margin: 0;
			background: none;
			pointer-events: none;
			-webkit-appearance: none;
			appearance: none;
		}
		.fret-range-slider input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: transparent; }
		.fret-range-slider input[type="range"]::-moz-range-track { background: transparent; }
		.fret-range-slider input[type="range"]::-webkit-slider-thumb {
			width: 18px;
			height: 18px;
			margin-top: -7px;
			border: 2px solid var(--pink);
			border-radius: 50%;
			background: var(--surface);
			cursor: pointer;
			pointer-events: auto;
			-webkit-appearance: none;
		}
		.fret-range-slider input[type="range"]::-moz-range-thumb {
			width: 14px;
			height: 14px;
			border: 2px solid var(--pink);
			border-radius: 50%;
			background: var(--surface);
			cursor: pointer;
			pointer-events: auto;
		}
		.fret-range-slider input[type="range"]:focus-visible::-webkit-slider-thumb { outline: 2px solid #286d7d; outline-offset: 2px; }
		.fret-range-slider input[type="range"]:focus-visible::-moz-range-thumb { outline: 2px solid #286d7d; outline-offset: 2px; }

		.scale-note-button {
			display: flex;
			min-height: 48px;
			align-items: center;
			gap: 10px;
			padding: 8px 14px 8px 9px;
			border: 1px solid var(--border);
			border-radius: 3px;
			background: var(--surface-soft);
			color: #59635b;
			font: inherit;
			font-size: 15px;
			cursor: pointer;
		}

		.scale-note-button:hover { border-color: rgba(32,39,33,.4); }
		.scale-note-button:focus-visible { outline: 2px solid #286d7d; outline-offset: 2px; }

		.scale-notes strong {
			display: grid;
			width: 30px;
			aspect-ratio: 1;
			place-items: center;
			border-radius: 50%;
			background: #313a32;
			color: #fff9e8;
			font-family: "DynaPuff", sans-serif;
			font-size: 13px;
		}

		.scale-note-button[data-state="focused"] { border-color: var(--focus-color); background: color-mix(in srgb, var(--focus-color) 13%, white); }
		.scale-note-button[data-state="focused"] strong { background: var(--focus-color); color: var(--focus-ink); }
		.scale-note-button[data-state="invisible"] { opacity: .55; }
		body[data-theme="night"] .scale-note-button[data-state="focused"] {
			border-color: color-mix(in srgb, var(--focus-color) 78%, white);
			background: color-mix(in srgb, var(--focus-color) 24%, #202725);
			color: #f5f1e8;
		}
		body[data-theme="night"] .scale-note-button[data-state="focused"] strong { background: var(--focus-color); color: var(--focus-ink); }
		body[data-theme="night"] .scale-note-button[data-state="showing"] { border-color: #7b8981; background: #303936; color: #e8eee8; }
		body[data-theme="night"] .scale-note-button[data-state="showing"] strong { background: #424d47; color: #f2f3ea; }
		body[data-theme="night"] .scale-note-button[data-state="invisible"] { border: 1px dashed #66716c; background: #242b28; color: #8b9890; opacity: 1; }
		body[data-theme="night"] .scale-note-button[data-state="invisible"] strong { background: #343d38; color: #a8b0aa; }
		.scale-note-button[data-blue="true"] {
			min-width: 112px;
			border-color: #0b4d68;
			background: #176d91;
			color: #fff;
		}
		.scale-note-entry { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
		.blue-note-tag {
			padding-left: 4px;
			color: #075777;
			font-size: 10px;
			font-weight: 900;
			letter-spacing: .07em;
		}
		.scale-note-button[data-blue="true"] strong { background: #313a32; }
		.scale-note-button[data-blue="true"][data-state="focused"] { border-color: #0b4d68; background: #125775; }
		.scale-note-button[data-blue="true"][data-state="focused"] strong { background: var(--focus-color); }
		.scale-note-button[data-blue="true"][data-state="invisible"] strong { background: #78868b; }
		body[data-theme="night"] .scale-note-button[data-blue="true"][data-state="invisible"] { border-color: #667b82; background: #25353a; color: #b8c8cb; }
		body[data-theme="night"] .scale-note-button[data-blue="true"][data-state="invisible"] strong { background: #46575c; color: #d5e0e2; }
		body[data-theme="night"] .blue-note-tag { color: #73c8ed; }
		body[data-theme="night"] .scale-note-button[data-blue="true"] { background: #125775; color: #fff; }

		.neck-scroll {
			overflow-x: auto;
			padding: 0 0 12px;
			scrollbar-color: #a98869 #e2ded2;
			-webkit-overflow-scrolling: touch;
			touch-action: pan-x pan-y;
		}

		.neck-layout {
			display: grid;
			min-width: var(--neck-min-width);
			grid-template-columns: 48px 48px 1fr;
			grid-template-rows: var(--neck-row-template);
			column-gap: 8px;
		}

		.fret-numbers {
			grid-column: 3;
			display: grid;
			grid-template-columns: repeat(24, minmax(0, 1fr));
			align-items: center;
			color: #69736a;
			font-family: "DynaPuff", sans-serif;
			font-size: var(--fret-number-size, 16px);
			font-weight: 700;
			line-height: 1;
			text-align: center;
		}

		/* Fret 0, above the open-string notes. */
		.open-fret-number {
			grid-column: 2;
			grid-row: 1;
			align-self: center;
			color: #a45e37;
			font-family: "DynaPuff", sans-serif;
			font-size: var(--fret-number-size, 16px);
			font-weight: 700;
			line-height: 1;
			text-align: center;
		}
		body[data-theme="night"] .fret-numbers { color: #b4b8ae; }
		body[data-theme="night"] .open-fret-number { color: #e0915f; }

		/* String labels, open strings and fretboard share the same vertical box
		   (5px = fretboard 4px padding + 1px border) and the same fixed rows,
		   so every string row lines up across the three columns. */
		.string-labels {
			grid-column: 1;
			grid-row: 2;
			display: grid;
			grid-template-rows: repeat(var(--string-count, 6), minmax(0, 1fr));
			padding: 5px 0;
			align-items: center;
			color: #59635b;
			font-family: Georgia, "Times New Roman", serif;
			font-size: var(--label-font-size);
			font-weight: 700;
		}

		/* String letters are dropdowns: a rounded box, no arrow, letter aligned left. */
		.string-note-select {
			display: block;
			width: 100%;
			min-width: 0;
			height: min(30px, 90%);
			padding: 0 2px 0 5px;
			border: 1px solid var(--border);
			border-left: 3px solid var(--pink);
			border-radius: 8px;
			background: var(--surface);
			box-shadow: 0 1px 2px rgba(44,35,24,.12);
			color: var(--ink);
			font: inherit;
			font-size: .85em;
			line-height: 1;
			text-align: left;
			text-align-last: left;
			cursor: pointer;
			-webkit-appearance: none;
			appearance: none;
		}
		.string-note-select:hover { border-color: var(--pink); }
		.string-note-select:focus-visible { outline: 2px solid #286d7d; outline-offset: 1px; }
		.string-note-select option { background: var(--surface); color: var(--ink); }
		body[data-theme="night"] .string-labels { color: #d8dcd2; }

		.open-strings {
			grid-column: 2;
			grid-row: 2;
			display: grid;
			grid-template-rows: repeat(var(--string-count, 6), minmax(0, 1fr));
			padding: 5px 0;
			place-items: center;
		}

		.open-cell {
			display: grid;
			width: 48px;
			place-items: center;
		}

		.fretboard {
			grid-column: 3;
			grid-row: 2;
			display: grid;
			grid-template-columns: repeat(24, minmax(0, 1fr));
			grid-template-rows: repeat(var(--string-count, 6), minmax(0, 1fr));
			overflow: visible;
			border: 1px solid var(--wood-dark);
			border-left: 5px solid #332b25;
			border-radius: 2px 5px 5px 2px;
			background:
				repeating-linear-gradient(2deg, transparent 0 28px, rgba(79,38,20,.11) 29px, transparent 31px 54px),
				linear-gradient(100deg, var(--wood-light), var(--wood) 100%);
			box-shadow: 0 13px 24px rgba(66,48,33,.17), inset 0 1px rgba(255,255,255,.42);
			position: relative;			
			padding: 4px 0; 
		}

		/* When the range doesn't start at fret 0 there is no nut on the left. */
		.fretboard.no-nut { border-left: 1px solid var(--wood-dark); }
		/* ...and the fretboard takes over the open-string column. */
		.neck-layout.no-open .open-strings,
		.neck-layout.no-open .open-fret-number { display: none; }
		.neck-layout.no-open .fretboard,
		.neck-layout.no-open .fret-numbers,
		.neck-layout.no-open .position-markers { grid-column: 2 / 4; }

		.fretboard::before {
			position: absolute;
			z-index: 0;
			inset: 0;
			background: radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(72,38,24,.1));
			content: "";
			pointer-events: none;
		}

		.fret-cell {
			position: relative;
			z-index: 2;
			display: grid;
			min-height: 0;
			place-items: center;
		}

		.fret-wire {
			position: absolute;
			z-index: 1;
			top: 0;
			bottom: 0;
			left: var(--left);
			width: 2px;
			background: var(--line);
			transform: translateX(-50%);
			pointer-events: none;
		}

		.fret-wire.double { width: 4px; }

		.inlay {
			position: absolute;
			z-index: 0;
			width: var(--inlay-size, 15px);
			aspect-ratio: 1;
			border-radius: 50%;
			background: radial-gradient(circle at 35% 30%, #fffaf0, #e6dcc6 55%, #c9bca2);
			box-shadow: inset 0 0 0 1px rgba(80,55,35,.25), 0 1px 1px rgba(255,255,255,.25);
			transform: translate(-50%, -50%);
			pointer-events: none;
		}
		body[data-theme="night"] .inlay { opacity: .7; }

		.string-line {
			position: absolute;
			z-index: 0;
			right: 0;
			left: 0;
			top: 50%;
			height: var(--thickness);
			background: linear-gradient(180deg, #fff9dc, #66645a 48%, #f3e7c7);
			box-shadow: 0 1px 2px rgba(28,25,20,.5);
			transform: translateY(-50%);
			pointer-events: none;
		}

		.note {

			.mobile-controls-panel {

					description.textContent = definition.description;
					button.append(description);
					button.setAttribute("aria-label", `${definition.name}. ${definition.description}`);
				}
				scaleSubmenu.append(button);
			});
		}

		function updateChords() {
			const key = keySelect.value;
			const definition = scaleFamilies[chordFamily].scales[chordScale];
			const chords = buildScaleChords(definition, keys.indexOf(key), chordType);
			selectedChord = Math.min(selectedChord, chords.length - 1);
			const activeChord = chords[selectedChord];

			const titleWithoutTuning = `${key} ${definition.name} ${chordTypes[chordType].toLowerCase()}`;
			const tuningTitle = tuningDisplayName();
			scaleTitleMain.textContent = titleWithoutTuning;
			scaleTitleTuning.textContent = `(${tuningTitle})`;
			mobileScaleTitle.textContent = titleWithoutTuning;
			document.querySelector("#scale-menu-summary").textContent = definition.name;
			document.title = `${titleWithoutTuning} (${tuningTitle}) | Guitar fretboard`;
			fretboard.setAttribute("aria-label", `${activeChord.name} chord notes on a ${fretCount}-fret guitar neck`);
			scaleNotes.setAttribute("aria-label", `Chords in ${key} ${definition.name}`);
			// Keep the chord names in the open menu in sync with the key.
			populateScales();

			scaleNotes.replaceChildren();
			chords.forEach((chord, index) => {
				const active = index === selectedChord;
				const entry = document.createElement("li");
				entry.className = "scale-note-entry";
				const button = document.createElement("button");
				button.type = "button";
				button.className = "scale-note-button";
				button.dataset.chordIndex = index;
				button.dataset.state = active ? "focused" : "showing";
				button.style.setProperty("--focus-color", rootFocusColor);
				button.style.setProperty("--focus-ink", focusedNoteText);
				button.setAttribute("aria-pressed", String(active));
				button.setAttribute("aria-label", `${chord.roman} ${chord.name}: ${chord.tones.map(tone => tone.note).join(" ")}`);
				button.title = `${chord.name}: ${chord.tones.map(tone => tone.note).join(" ")}`;
				button.innerHTML = `<strong>${chord.roman}</strong> ${chord.name}`;
				entry.append(button);
				scaleNotes.append(entry);
			});

			// Root of the chord in red, the other chord tones in the colour stack order.
			const toneColors = new Map(activeChord.tones.map((tone, index) => [tone.pitch, tone.root ? rootFocusColor : focusColors[index - 1]]));
			const chordTones = new Map(activeChord.tones.map(tone => [tone.pitch, tone]));
			notePositions.forEach(cell => {
				cell.querySelector(".note")?.remove();
				const tone = chordTones.get(Number(cell.dataset.pitch));
				if (!tone) return;
				const note = document.createElement("span");
				note.className = `note focused${tone.root ? " root" : ""}`;
				note.style.setProperty("--focus-color", toneColors.get(tone.pitch));
				note.style.setProperty("--focus-ink", focusedNoteText);
				note.setAttribute("aria-label", `${tone.note}, chord tone ${tone.degree}`);
				note.innerHTML = `<strong>${tone.note}</strong><small>${tone.degree}</small>`;
				cell.append(note);
			});
		}

		function updateScale(resetNoteStates = true) {
					if (mode === "chords") return updateChords();
					const key = keySelect.value;
					const family = scaleFamilies[selectedFamily];
					const definition = family.scales[selectedScale];
					const rootPitch = keys.indexOf(key);
					const tones = definition.intervals.map((interval, index) => ({
						pitch: (rootPitch + interval) % 12,
						interval,
						note: noteNames[(rootPitch + interval) % 12],
						degree: definition.degrees[index],
						root: index === 0,
						blue: definition.blueInterval === interval
					}));
					const blueNoteAvailable = selectedFamily === "pentatonic" && ["minor", "major"].includes(selectedScale);
					const blueInterval = selectedScale === "major" ? 3 : 6;
					if (blueNoteAvailable) {
						tones.push({
							pitch: (rootPitch + blueInterval) % 12,
							interval: blueInterval,
							note: noteNames[(rootPitch + blueInterval) % 12],
							degree: selectedScale === "major" ? "♭3" : "♭5",
							root: false,
							blue: true,
							optional: true
						});
					}
					tones.sort((first, second) => first.interval - second.interval);
					const scale = new Map(tones.map(tone => [tone.pitch, tone]));

					const titleWithoutTuning = `${key} ${family.label} ${definition.name}`;
					const tuningTitle = tuningDisplayName();
					scaleTitleMain.textContent = titleWithoutTuning;
					scaleTitleTuning.textContent = `(${tuningTitle})`;
					mobileScaleTitle.textContent = titleWithoutTuning;
					// Scale dropdown shows the selected scale's name (no family or subgroup).
					document.querySelector("#scale-menu-summary").textContent = definition.name;
					document.title = `${titleWithoutTuning} (${tuningTitle}) | Guitar fretboard`;
					fretboard.setAttribute("aria-label", `${key} ${definition.name} notes on a ${fretCount}-fret guitar neck`);
					scaleNotes.setAttribute("aria-label", `Notes in ${key} ${definition.name}`);

					if (resetNoteStates) {
						noteStates = new Map(tones.map(tone => [
							tone.pitch,
							tone.optional ? "invisible" : tone.root ? "focused" : "showing"
						]));
						focusColorByPitch = new Map();
						tones.forEach(tone => {
							if (noteStates.get(tone.pitch) === "focused" && !tone.blue && !tone.root) takeFocusColor(tone.pitch);
						});
					}

					scaleNotes.replaceChildren();
					tones.forEach(tone => {
						const state = noteStates.get(tone.pitch) || "showing";
						const entry = document.createElement("li");
						entry.className = "scale-note-entry";
						const button = document.createElement("button");
						button.type = "button";
						button.className = "scale-note-button";
						button.dataset.pitch = tone.pitch;
						button.dataset.state = state;
						button.dataset.blue = String(tone.blue);
						button.dataset.root = String(tone.root);
						button.dataset.degree = tone.degree;
						const focusColor = getToneFocusColor(tone);
						button.style.setProperty("--focus-color", focusColor);
						button.style.setProperty("--focus-ink", focusedNoteText);
						button.setAttribute("aria-pressed", String(state === "focused"));
						button.setAttribute("aria-label", `${tone.degree} ${tone.note}, ${state}. Activate to change state.`);
						button.title = `${tone.degree} ${tone.note}: ${state}`;
						button.innerHTML = `<strong>${tone.degree}</strong> ${tone.note}`;
						if (tone.blue) {
							const tag = document.createElement("span");
							tag.className = "blue-note-tag";
							tag.textContent = "BLUE NOTE";
							entry.append(button, tag);
						} else {
							entry.append(button);
						}
						scaleNotes.append(entry);
					});

					notePositions.forEach(cell => {
						cell.querySelector(".note")?.remove();
						const tone = scale.get(Number(cell.dataset.pitch));
						if (!tone) return;
						const state = noteStates.get(tone.pitch) || "showing";
						if (state === "invisible") return;

						const note = document.createElement("span");
						note.className = `note ${state}${tone.root ? " root" : ""}${tone.blue ? " blue" : ""}`;
						const focusColor = getToneFocusColor(tone);
						note.style.setProperty("--focus-color", focusColor);
						note.style.setProperty("--focus-ink", focusedNoteText);
						note.setAttribute("aria-label", `${tone.note}, scale degree ${tone.degree}`);
						note.innerHTML = `<strong>${tone.note}</strong><small>${tone.degree}</small>`;
						cell.append(note);
					});
				}
		scaleFamilyList.addEventListener("click", event => {
			const button = event.target.closest("[data-family]");
			if (!button) return;
			openMenuFamily = button.dataset.family;
			if (mode === "notes" && openMenuFamily === "pentatonic") {
				openPentatonicGroup = selectedFamily === "pentatonic" ?
					scaleFamilies.pentatonic.scales[selectedScale].group : "common";
			}
			populateScales();
		});
		scaleSubmenu.addEventListener("click", event => {
			const typeButton = event.target.closest("[data-chord-type]");
			if (!typeButton) return;
			chordType = typeButton.dataset.chordType;
			updateScale();
		});
		scaleSubmenu.addEventListener("click", event => {
			const groupButton = event.target.closest("[data-pentatonic-group]");
			if (!groupButton) return;
			openPentatonicGroup = groupButton.dataset.pentatonicGroup;
			populateScales();
		});
		tuningFamilyList.addEventListener("click", event => {
			const button = event.target.closest("[data-tuning-instrument]");
			if (!button) return;
			openTuningInstrument = button.dataset.tuningInstrument;
			const groups = instruments[openTuningInstrument].groups;
			if (groups) {
				const current = tunings[selectedTuning];
				openTuningGroup = current && current.instrument === openTuningInstrument ? current.group : Object.keys(groups)[0];
			}
			populateTunings();
		});
		tuningSubmenu.addEventListener("click", event => {
			const groupButton = event.target.closest("[data-tuning-subgroup]");
			if (!groupButton) return;
			openTuningGroup = groupButton.dataset.tuningSubgroup;
			populateTunings();
		});
		tuningSubmenu.addEventListener("click", event => {
			const button = event.target.closest("[data-tuning]");
			if (!button) return;
			selectedTuning = button.dataset.tuning;
			updateTuning();
			tuningMenu.open = false;
		});
		scaleSubmenu.addEventListener("click", event => {
			const button = event.target.closest("[data-scale]");
			if (!button) return;
			if (mode === "chords") {
				chordFamily = openMenuFamily;
				chordScale = button.dataset.scale;
				selectedChord = 0;
			} else {
				selectedFamily = openMenuFamily;
				selectedScale = button.dataset.scale;
			}
			updateScale();
			scaleMenu.open = false;
		});
		// Close either dropdown when tapping anywhere outside its details element.
		document.addEventListener("pointerdown", event => {
			if (!tuningMenu.contains(event.target)) tuningMenu.open = false;
			if (!scaleMenu.contains(event.target)) scaleMenu.open = false;
		});
		document.querySelector("#mobile-controls-backdrop").addEventListener("click", () => {
			tuningMenu.open = false;
			scaleMenu.open = false;
			mobileControlsDrawer.open = false;
		});
		// Escape closes open menus and the mobile controls drawer.
		document.addEventListener("keydown", event => {
			if (event.key !== "Escape") return;
			tuningMenu.open = false;
			scaleMenu.open = false;
			mobileControlsDrawer.open = false;
		});

		scaleNotes.addEventListener("click", event => {
			// Chords mode: only one chord active at a time.
			const chordButton = event.target.closest("[data-chord-index]");
			if (chordButton) {
				selectedChord = Number(chordButton.dataset.chordIndex);
				updateChords();
				return;
			}
			const button = event.target.closest("[data-pitch]");
			if (!button) return;
			const pitch = Number(button.dataset.pitch);
			const currentState = noteStates.get(pitch);
			const nextState = { focused: "showing", showing: "invisible", invisible: "focused" }[currentState];
			noteStates.set(pitch, nextState);
			// The root (red) and blue notes keep their own colour and never use the colour stack.
			if (button.dataset.blue !== "true" && button.dataset.root !== "true") {
				if (currentState === "focused") releaseFocusColor(pitch);
				if (nextState === "focused") takeFocusColor(pitch);
			}
			updateScale(false);
		});
		keySelect.addEventListener("change", updateScale);
		modeSelect.addEventListener("change", () => {
			mode = modeSelect.value;
			openMenuFamily = mode === "chords" ? chordFamily : selectedFamily;
			if (mode === "notes" && openMenuFamily === "pentatonic") openPentatonicGroup = scaleFamilies.pentatonic.scales[selectedScale].group;
			scaleLabel.textContent = mode === "chords" ? "Chord scale" : "Scale";
			populateScales();
			updateScale();
		});
		themeToggle.addEventListener("click", () => {
			const isNight = document.body.dataset.theme !== "night";
			document.body.dataset.theme = isNight ? "night" : "day";
			themeToggle.setAttribute("aria-pressed", String(isNight));
			themeToggle.setAttribute("aria-label", `${isNight ? "Disable" : "Enable"} night mode`);
			themeToggle.innerHTML = `<span aria-hidden="true">${isNight ? "☀" : "☾"}</span> ${isNight ? "Day mode" : "Night mode"}`;
		});
		populateScales();
		setStringCount(6);
		populateTunings();
		buildFretboard();
		renderFretRange();
		syncResponsiveControls();
		updateTuning();
		responsiveControlsReady = true;
	</script>
</body>
</html>
